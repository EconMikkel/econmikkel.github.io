# Presentations, talks, and workshops.
# Listed newest first on /presentations/, grouped by year.
#
# Fields:
#   year:    (required) used for grouping
#   place:   where it was given, e.g. "SODAS" or "ROCKWOOL Foundation"
#   context: the occasion, e.g. "AI Workshop", "Data Discussion", "Conference X"
#   title:   title of the presentation
#   date:    (optional) free text, e.g. "March" or "12 March"
#   url:     (optional) link to slides/recording — makes the title clickable
#
# Example:
#   - year: 2026
#     date: "March"
#     place: "SODAS"
#     context: "AI Workshop"
#     title: "Attrition Bias in AI-Administered Interviews"
#     url: "https://example.com/slides.pdf"

